name: Recipe manifest CPU (source-only)
on:
  push:
    paths:
      - 'schemas/**'
      - 'recipes/**'
      - 'scripts/manager/**'
      - 'scripts/temporary/**'
      - 'tests/test_p1_temporary_cpu.py'
      - 'tests/test_manager_manifest_cpu.py'
      - 'tests/fixtures/**'
      - 'requirements-manager.txt'
      - 'flash'
      - 'profiles/**'
      - 'scripts/serve.sh'
      - 'wizard/**'
      - 'wizard.sh'
      - 'tests/test_wizard_router_cpu.py'
      - 'tests/test_wizard_quickstart_cpu.py'
      - 'tests/test_flash_launch.py'
      - 'tests/test_manager_inventory_cpu.py'
      - 'tests/test_p1_*_cpu.py'
      - 'tests/test_p2_*_cpu.py'
      - 'tests/test_service_manifest_cpu.py'
      - 'tests/test_service_journal_cpu.py'
      - 'tests/test_script_modes_cpu.py'
      - '.github/workflows/recipe-manifest-cpu.yml'
  pull_request:
    paths:
      - 'scripts/temporary/**'
      - 'tests/test_p1_temporary_cpu.py'
      - 'wizard/**'
      - 'wizard.sh'
      - 'tests/test_wizard_router_cpu.py'
      - 'schemas/**'
      - 'recipes/**'
      - 'scripts/manager/**'
      - 'tests/test_manager_manifest_cpu.py'
      - 'tests/fixtures/**'
      - 'requirements-manager.txt'
      - '.github/workflows/recipe-manifest-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only schema dependencies
        run: python -m pip install -r requirements-manager.txt
      - name: Validate manifest unit tests (no Docker, GPU or network runtime)
        run: |
          python -m unittest discover -s tests -p 'test_manager_manifest_cpu.py' -v
          python -m unittest discover -s tests -p 'test_manager_inventory_cpu.py' -v
          python -m unittest discover -s tests -p 'test_flash_launch.py' -v
          python -m unittest discover -s tests -p 'test_script_modes_cpu.py' -v
          python -m unittest discover -s tests -p 'test_p1_*_cpu.py' -v
          python -m unittest discover -s tests -p 'test_p2_*_cpu.py' -v
          python -m unittest discover -s tests -p 'test_service_manifest_cpu.py' -v
          python -m unittest discover -s tests -p 'test_service_journal_cpu.py' -v
          python -m unittest discover -s tests -p 'test_wizard_router_cpu.py' -v
          python -m unittest discover -s tests -p 'test_wizard_quickstart_cpu.py' -v
          python -m wizard list --json
          python -m wizard p2 status --json
          python -m wizard model 27b status --inspect-cache --json
          bash -n flash scripts/serve.sh wizard/00-doctor.sh wizard/10-plan.sh wizard/p1.sh wizard.sh scripts/temporary/p1-post-download.sh
      - name: Confirm 27B candidate is not launchable
        run: |
          if python -m scripts.manager.manifest validate recipes/qwen38-27b.candidate.yaml; then
            echo "::error::27B candidate unexpectedly passed"; exit 1
          fi
